# Configuración de análisis para SonarCloud.
#
# Los dos primeros valores los genera SonarCloud al conectar el repositorio y
# tienen que coincidir exactamente con los del proyecto; no son inventables.
# El token NO va aquí: vive como secreto SONAR_TOKEN en GitHub Actions.
sonar.projectKey=Wilmer328_April_Collections
sonar.organization=wilmer328

sonar.projectName=April Collections
sonar.projectVersion=1.0.0

# ── Qué se analiza ────────────────────────────────────────────────────────
# Todo el JavaScript propio, esté donde esté.
#
# Antes esto era solo `src`, con el argumento de que los HTML son documentos y
# no módulos. Medido, el argumento no se sostiene: app.html lleva 1258 líneas
# de JavaScript escritas dentro del propio archivo, y entre las cuatro páginas
# suman 1556. Son más líneas que cualquier módulo de src.
#
# Analizar solo src dejaba el 42% del código del proyecto sin mirar, y
# justamente la parte menos ordenada. Un análisis de calidad que ignora el
# archivo más grande describe otro proyecto.
#
# Se incluyen también el service worker y el middleware: son código que se
# ejecuta en producción, no configuración.
sonar.sources=\
  src,\
  public/sw.js,\
  public/enable-motion.js,\
  middleware.js,\
  index.html,\
  login.html,\
  app.html,\
  panel.html

sonar.tests=tests

sonar.sourceEncoding=UTF-8

# ── Cobertura ─────────────────────────────────────────────────────────────
# La genera `npm run test:coverage` con Vitest, en formato LCOV, que es lo que
# SonarCloud sabe leer. El pipeline la produce antes de lanzar el análisis.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── Exclusiones ───────────────────────────────────────────────────────────
# Se excluye únicamente lo que no es código propio o no se escribió a mano.
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**

# ── Qué cuenta para la cobertura ──────────────────────────────────────────
# Analizar y medir cobertura son dos cosas distintas, y aquí se separan a
# propósito.
#
# El JavaScript que vive dentro de los HTML es pegamento de una página
# concreta: lee del DOM, escucha eventos y pinta. Las pruebas corren en Node
# sin navegador, así que no hay forma de ejecutarlo desde un test unitario.
# Contarlo como «sin cubrir» no informaría de nada: mediría la cobertura de
# código que nunca se planteó cubrir así, y hundiría el número hasta hacerlo
# inútil para ver si la lógica de verdad está probada.
#
# Se analiza igual —bugs, vulnerabilidades y code smells sí se le miran—, pero
# queda fuera del porcentaje.
#
# Lo que NO se excluye es ninguna capa de src, ni siquiera las que hoy están
# al 0% (auth, ui, config). Dejarlas fuera subiría el porcentaje sin haber
# probado una línea más, y el número dejaría de significar algo.
sonar.coverage.exclusions=\
  tests/**,\
  vite.config.js,\
  middleware.js,\
  public/**,\
  index.html,\
  login.html,\
  app.html,\
  panel.html
