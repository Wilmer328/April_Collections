# Configuración de análisis para SonarCloud.
#
# PENDIENTE DE COMPLETAR — dos valores los genera SonarCloud al crear el
# proyecto y no pueden inventarse aquí. Al conectar el repositorio en
# sonarcloud.io, copia los que te muestre y sustitúyelos abajo:
#
#   sonar.projectKey        Analysis Method → With GitHub Actions
#   sonar.organization      Es tu usuario u organización de SonarCloud
#
sonar.projectKey=PENDIENTE
sonar.organization=PENDIENTE

sonar.projectName=April Collections
sonar.projectVersion=1.0.0

# ── Qué se analiza ────────────────────────────────────────────────────────
# Solo el código fuente propio. app.html, index.html y login.html quedan
# fuera del análisis de código porque son documentos, no módulos.
sonar.sources=src
sonar.tests=tests

sonar.sourceEncoding=UTF-8

# ── Cobertura ─────────────────────────────────────────────────────────────
# La genera `npm run test:coverage` con Vitest, en formato LCOV, que es lo que
# SonarCloud sabe leer. El pipeline la produce antes de lanzar el análisis.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── Exclusiones ───────────────────────────────────────────────────────────
# Se excluye únicamente lo que no es código propio o no aporta al análisis.
# NO se excluyen las capas sin pruebas todavía: dejarlas fuera subiría el
# porcentaje de cobertura sin haber probado una sola línea más, y el número
# dejaría de significar algo.
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  public/**

# Las pruebas no se miden a sí mismas.
sonar.coverage.exclusions=\
  tests/**,\
  vite.config.js
