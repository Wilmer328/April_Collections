<style>
  .panel {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  .panel__cabecera {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 28px;
  }

  .panel__titulo {
    font-family: var(--font-display);
    font-size: clamp(24px, 4vw, 32px);
    margin: 0 0 6px;
  }

  .panel__lead { color: var(--muted); margin: 0; }

  .tarjeta {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  .tarjeta__titulo {
    font-family: var(--font-display);
    font-size: var(--text-lg);
    font-weight: 600;
    margin: 0 0 14px;
  }

  .dato { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .dato:last-child { border-bottom: none; }
  .dato__clave { color: var(--muted); }
  .dato__valor { font-weight: 600; text-align: right; word-break: break-word; }

  .cargando {
    max-width: 720px; margin: 0 auto; padding: 64px 24px;
    text-align: center; color: var(--muted);
  }

  .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

  [hidden] { display: none !important; }
</style>

<body class="ac-page">

<!-- Se ve mientras se comprueba la sesión. Sin datos del negocio. -->
<div class="cargando" id="cargando">
  <p>Comprobando tu sesión…</p>
</div>

<!-- El contenido privado NO se sirve en el HTML. Se construye en JavaScript
     despues de verificar la sesion, asi la respuesta a una peticion sin
     sesion no contiene ni las etiquetas del panel. Ocultarlo con CSS no
     bastaba: el marcado viajaba igual y cualquiera podia leerlo viendo el
     codigo fuente o con una peticion sin navegador. -->
<main class="panel" id="contenido" hidden></main>

<script type="module">
  import { isSupabaseConfigured } from './src/config/env.js';
  import { obtenerUsuarioActual, cerrarSesion } from './src/auth/session.js';

  const LOGIN = './login.html';

  const cargando = document.getElementById('cargando');
  const contenido = document.getElementById('contenido');

  /**
   * Saca al visitante del área privada.
   *
   * Se usa location.replace y no href para que el botón «atrás» del navegador
   * no devuelva a esta página.
   */
  function expulsar() {
    window.location.replace(LOGIN);
  }

  /** Crea un elemento con sus clases y su texto ya puestos. */
  function crear(etiqueta, clases, texto) {
    const nodo = document.createElement(etiqueta);
    if (clases) nodo.className = clases;
    // textContent y nunca innerHTML: el nombre y el correo vienen del
    // proveedor de identidad y no deben poder inyectar marcado.
    if (texto !== undefined) nodo.textContent = texto;
    return nodo;
  }

  /** Fila de dato con su etiqueta y su valor. */
  function fila(clave, valor) {
    const contenedor = crear('div', 'dato');
    contenedor.append(crear('span', 'dato__clave', clave), crear('span', 'dato__valor', valor));
    return contenedor;
  }

  /**
   * Construye el panel en memoria y lo inserta.
   *
   * Todo el marcado privado se crea aquí y no viene en el HTML: una petición
   * sin sesión recibe una página sin rastro de este contenido.
   */
  function construirPanel(usuario) {
    const cabecera = crear('div', 'panel__cabecera');
    const titulos = document.createElement('div');
    titulos.append(
      crear('h1', 'panel__titulo', 'Panel privado'),
      crear('p', 'panel__lead', 'Datos de tu cuenta y del despliegue.'),
    );

    const irApp = crear('a', 'ac-btn ac-btn--ghost', '← Ir a la aplicación');
    irApp.href = './app.html';
    cabecera.append(titulos, irApp);

    const cuenta = crear('section', 'tarjeta');
    cuenta.append(
      crear('h2', 'tarjeta__titulo', 'Tu cuenta'),
      fila('Nombre', usuario.nombre),
      fila('Correo', usuario.email),
      fila('Identificador', usuario.id),
    );

    const acciones = crear('div', 'acciones');
    const salir = crear('button', 'ac-btn ac-btn--ghost', 'Cerrar sesión');
    salir.type = 'button';
    salir.addEventListener('click', async () => {
      salir.disabled = true;
      try {
        await cerrarSesion();
      } finally {
        expulsar();
      }
    });
    acciones.append(salir);
    cuenta.append(acciones);

    const servicio = crear('section', 'tarjeta');
    const estado = crear('div', 'ac-note', 'Consultando…');
    servicio.append(crear('h2', 'tarjeta__titulo', 'Estado del servicio'), estado);

    contenido.replaceChildren(cabecera, cuenta, servicio);
    contenido.hidden = false;
    cargando.hidden = true;

    consultarServicio(estado);
  }

  /** Consulta el healthcheck y resume el estado del despliegue. */
  async function consultarServicio(destino) {
    try {
      const respuesta = await fetch('/api/health', { cache: 'no-store' });
      const datos = await respuesta.json();

      destino.className = 'ac-note ac-note--success';
      destino.textContent =
        `Servicio ${datos.estado} · entorno ${datos.despliegue.entorno} · versión ${datos.version}`;
    } catch {
      destino.className = 'ac-note ac-note--warning';
      destino.textContent = 'No se pudo consultar el estado del servicio.';
    }
  }

  async function iniciar() {
    // Sin Supabase configurado no existe forma de tener sesión, así que nadie
    // puede entrar. Se falla CERRADO a propósito: en un área privada, ante la
    // duda, no se muestra nada.
    if (!isSupabaseConfigured()) {
      expulsar();
      return;
    }

    try {
      const usuario = await obtenerUsuarioActual();

      if (!usuario) {
        expulsar();
        return;
      }

      construirPanel(usuario);
    } catch {
      expulsar();
    }
  }

  iniciar();
</script>

</body>
</html>
